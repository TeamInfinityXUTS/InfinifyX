name: ClearML Data CI Pipeline

on:
  push:
    branches: [ "main", "feat/data-engineering" ]
  workflow_dispatch:

jobs:
  trigger-clearml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install clearml

    - name: Trigger ClearML Pipeline (Remote Execution)
      env:
        CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
        CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        CLEARML_API_HOST: ${{ secrets.CLEARML_API_HOST }}
        CLEARML_WEB_HOST: ${{ secrets.CLEARML_WEB_HOST }}
        CLEARML_FILES_HOST: ${{ secrets.CLEARML_FILES_HOST }}
      run: |
        python - <<'EOF'
        import os
        from clearml import Task

        print("[CI] Connecting to ClearML server...")

        # Task.create() with repo/script info tells the agent:
        #   1. Clone this Git repo
        #   2. Checkout this branch
        #   3. Run this script
        task = Task.create(
            project_name="MLOps_Level2",
            task_name="[CI Trigger] Data Pipeline",
            task_type=Task.TaskTypes.data_processing,
            repo="https://github.com/TeamInfinityXUTS/InfinifyX.git",
            branch=os.environ.get("GITHUB_REF_NAME", "feat/data-engineering"),
            script="MLOps/DataProcessing/extract_convert_upload_pipeline.py",
        )

        # Add pipeline parameters so the script can read them
        task.set_parameter("General/dataset_path", "data_preprocessing/datasets/bdd100k")
        task.set_parameter("General/subset_percentage", 1)
        task.set_parameter("General/output_dataset_name", "BDD100k_1percent_YOLO")

        # Enqueue to the data_engineer queue - local agent will pick it up
        Task.enqueue(task, queue_name="data_engineer")

        print(f"[CI] Pipeline trigger task enqueued! Task ID: {task.id}")
        print(f"[CI] Your local data_engineer agent will clone the repo and run the pipeline.")
        EOF

