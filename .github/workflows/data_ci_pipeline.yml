name: ClearML Data CI Pipeline

on:
  push:
    branches: [ "main", "feat/data-engineering" ]
  workflow_dispatch:

jobs:
  run-pipeline-controller:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install clearml

    - name: Execute Pipeline Controller
      env:
        CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
        CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        CLEARML_API_HOST: ${{ secrets.CLEARML_API_HOST }}
        CLEARML_WEB_HOST: ${{ secrets.CLEARML_WEB_HOST }}
        CLEARML_FILES_HOST: ${{ secrets.CLEARML_FILES_HOST }}
      run: |
        echo "Starting ClearML Pipeline Controller..."
        python MLOps/DataProcessing/extract_convert_upload_pipeline.py
