name: ClearML End-to-End CI Pipeline

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Product/product_piepline/**'
      - 'MLOps/**'
      - '.github/workflows/data_ci_pipeline.yml'
  workflow_dispatch:

jobs:
  trigger-clearml-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install clearml

    - name: Trigger ClearML End-to-End Pipeline
      env:
        CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
        CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        CLEARML_API_HOST: ${{ secrets.CLEARML_API_HOST }}
        CLEARML_WEB_HOST: ${{ secrets.CLEARML_WEB_HOST }}
        CLEARML_FILES_HOST: ${{ secrets.CLEARML_FILES_HOST }}
      run: |
        python - <<'EOF'
        import os
        from clearml import Task

        print("[CI] Connecting to ClearML server...")

        # Create a task that tells the agent to:
        #   1. Clone this Git repo
        #   2. Checkout this branch
        #   3. Run the ci_runner script sequentially
        task = Task.create(
            project_name="MLOps_Product_Assisted_Driving",
            task_name="[CI Trigger] Sequential Pipeline",
            task_type=Task.TaskTypes.training,
            repo="https://github.com/TeamInfinityXUTS/InfinifyX.git",
            branch=os.environ.get("GITHUB_REF_NAME", "main"),
            script="scripts/ci_runner.py",
        )

        # Override pipeline parameters (CI uses small subset for speed)
        task.set_parameter("General/dataset_path", "data_preprocessing/datasets/bdd100k")
        task.set_parameter("General/subset_percentage", 0.1)
        task.set_parameter("General/yolo_epochs", 1)
        task.set_parameter("General/gnn_epochs", 1)
        task.set_parameter("General/hpo_trials", 2)
        task.set_parameter("General/multi_epochs", 1)

        # Enqueue to the data_engineer queue — agent will pick it up
        Task.enqueue(task, queue_name="data_engineer")

        print(f"[CI] End-to-End Pipeline enqueued! Task ID: {task.id}")
        print(f"[CI] Your data_engineer agent will clone the repo and run the pipeline.")
        EOF
