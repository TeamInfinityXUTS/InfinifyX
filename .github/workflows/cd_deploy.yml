name: "CD - Deploy Inference Server"

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm deployment"
        required: true
        default: "deploy"

jobs:
  validate-and-notify:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'deploy'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install minimal dependencies for syntax check
      run: |
        python -m pip install --upgrade pip
        pip install fastapi uvicorn

    - name: Validate server code (syntax check)
      run: |
        echo "=== Checking server/inference_server.py syntax ==="
        python -m py_compile server/inference_server.py
        echo "✓ inference_server.py compiles OK"

    - name: Validate deploy script exists
      run: |
        test -f scripts/deploy.sh && echo "✓ scripts/deploy.sh exists" || exit 1

    - name: Deployment instructions
      run: |
        echo ""
        echo "=============================================="
        echo "  CD VALIDATION PASSED"
        echo "=============================================="
        echo ""
        echo "  Code is ready for deployment."
        echo "  Commit: ${{ github.sha }}"
        echo "  Branch: ${{ github.ref_name }}"
        echo ""
        echo "  >>> Run this on your SageMaker terminal: <<<"
        echo ""
        echo "    cd /home/sagemaker-user/InfinifyX && bash scripts/deploy.sh"
        echo ""
        echo "  This will:"
        echo "    1. git pull the latest code"
        echo "    2. Stop any running server"
        echo "    3. Restart on port 8000"
        echo ""
        echo "  Access URL:"
        echo "    https://<your-domain>.studio.sagemaker.ap-southeast-2.app.aws/jupyterlab/default/proxy/8000/"
        echo ""
        echo "=============================================="
